<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}
</script>

<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<div id="status" class="text-center text-sm mt-2"></div>

<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500">Logout</button>
</div>

<div class="p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"></textarea>
<button onclick="app.solveQuestion()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded">
Solve
</button>
</div>

<div id="output" class="p-4 text-lg"></div>

<div class="p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<script>

// 👑 ADMIN
const ADMIN_EMAIL = "lakshmikirankarpingari@gmail.com";

// LOGOUT
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

// USER
function getUser() {
  return localStorage.getItem("currentUser");
}

// CACHE
function getCache() {
  return JSON.parse(localStorage.getItem("cache_" + getUser()) || "{}");
}
function setCache(q,a){
  const c=getCache(); c[q]=a;
  localStorage.setItem("cache_"+getUser(),JSON.stringify(c));
}

// HISTORY
function getHistory(){
  return JSON.parse(localStorage.getItem("history_"+getUser())||"[]");
}
function addHistory(q,a){
  const h=getHistory(); h.unshift({q,a});
  localStorage.setItem("history_"+getUser(),JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  const h=getHistory();
  document.getElementById("history").innerHTML =
    h.map(i=>`<div class="bg-white p-2 mb-2">${i.q}<br>${i.a}</div>`).join("");
}

// TRIAL
function getTrial(){
  return parseInt(localStorage.getItem("trial_"+getUser())||"0");
}
function incTrial(){
  localStorage.setItem("trial_"+getUser(), getTrial()+1);
}

// LIMIT
let usage = JSON.parse(localStorage.getItem("usage")||"{}");
function today(){ return new Date().toISOString().split("T")[0]; }

// ACCESS
function canUse(){
  const user=getUser();

  if(user===ADMIN_EMAIL) return true;

  if(getTrial()<5){ incTrial(); return true; }

  if(!usage[today()]) usage[today()]=0;

  if(usage[today()]>=3) return false;

  usage[today()]++;
  localStorage.setItem("usage",JSON.stringify(usage));
  return true;
}

// STATUS
function updateStatus(){
  const user=getUser();
  let text="";

  if(user===ADMIN_EMAIL) text="👑 Admin Unlimited";
  else if(getTrial()<5) text="🎁 Trial left: "+(5-getTrial());
  else text="🆓 Daily left: "+(3-(usage[today()]||0));

  document.getElementById("status").innerText=text;
}

// FALLBACK
function fallback(q){
  if(q.includes("2+2")) return "4";
  return "⚠️ Server busy. Try later.";
}

// APP
const app={
async solveQuestion(){

  const q=document.getElementById("questionInput").value.trim();
  if(!q) return alert("Enter question");

  if(!canUse()) return alert("Limit reached");

  const cache=getCache();
  if(cache[q]) return document.getElementById("output").innerText=cache[q];

  document.getElementById("output").innerText="⏳ Thinking...";

  try{
    const res=await fetch("/api/ask-ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await res.json();

    if(!res.ok || !data.answer){
      document.getElementById("output").innerText=fallback(q);
      return;
    }

    document.getElementById("output").innerText=data.answer;
    setCache(q,data.answer);
    addHistory(q,data.answer);

  }catch{
    document.getElementById("output").innerText=fallback(q);
  }

  updateStatus();
}
};

// INIT
renderHistory();
updateStatus();

</script>

</body>
</html>
