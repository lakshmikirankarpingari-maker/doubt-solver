<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-gray-100">

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}
</script>

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-2xl font-bold shadow">
🤖 DoubtSolve AI
</div>

<!-- STATUS -->
<div id="status" class="text-center text-sm mt-2 text-gray-600"></div>

<!-- LOGOUT -->
<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500 hover:underline">Logout</button>
</div>

<!-- INPUT -->
<div class="max-w-xl mx-auto mt-4 bg-white p-4 rounded-xl shadow">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"
placeholder="Ask your question..."></textarea>

<button onclick="app.solveQuestion()"
class="mt-3 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
Solve
</button>
</div>

<!-- 🔒 DEMO (ADMIN ONLY) -->
<div id="demoSection" class="max-w-xl mx-auto mt-4 hidden">
<h2 class="font-bold mb-2">📘 Demo Questions (Admin Only)</h2>
<div id="demoList" class="grid gap-2"></div>
</div>

<!-- OUTPUT -->
<div id="output" class="max-w-xl mx-auto mt-4 bg-white p-4 rounded-xl shadow text-lg"></div>

<!-- HISTORY -->
<div class="max-w-xl mx-auto p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<style>
.card{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.2s;
}
.card:hover{
  transform:scale(1.02);
  background:#f0f9ff;
}
</style>

<script>

// 👑 ADMIN
const ADMIN_EMAIL = "lakshmikirankarpingari@gmail.com";

// ================= DEMO DATA =================
const EXAMPLES = {
m1:{q:"What is 2 + 2?",a:"2 + 2 = 4"},
m2:{q:"What is 5 × 6?",a:"30"},
m3:{q:"Square of 7?",a:"49"},
m4:{q:"√64?",a:"8"},
m5:{q:"Solve: 3x = 12",a:"x = 4"},

p1:{q:"Newton’s First Law?",a:"Object remains in motion unless force acts."},
p2:{q:"Formula of force?",a:"F = ma"},
p3:{q:"Unit of power?",a:"Watt"},
p4:{q:"Speed formula?",a:"Distance / Time"},

c1:{q:"Formula of water?",a:"H₂O"},
c2:{q:"CO2 formula?",a:"CO₂"},
c3:{q:"What is acid?",a:"Releases H+"},

b1:{q:"Photosynthesis?",a:"Plants make food using sunlight"},
b2:{q:"Cell?",a:"Basic unit of life"},
b3:{q:"DNA?",a:"Genetic material"},

cs1:{q:"What is AI?",a:"Machines mimicking intelligence"},
cs2:{q:"Algorithm?",a:"Step-by-step solution"},
cs3:{q:"Programming?",a:"Writing instructions"}
};

// ================= DEMO UI =================
function renderDemo(){
  const list = document.getElementById("demoList");

  list.innerHTML = Object.keys(EXAMPLES).map(k => `
    <div class="card" onclick="loadExample('${k}')">
      ${EXAMPLES[k].q}
    </div>
  `).join("");
}

function loadExample(key){
  const ex = EXAMPLES[key];
  questionInput.value = ex.q;
  output.innerText = "📘 Demo Answer:\n\n" + ex.a;
}

// 🔒 SHOW DEMO ONLY FOR ADMIN
function controlDemoAccess(){
  if(getUser() === ADMIN_EMAIL){
    document.getElementById("demoSection").classList.remove("hidden");
  }
}

// ================= CORE =================
function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

function getUser(){
  return localStorage.getItem("currentUser");
}

// CACHE
function getCache(){
  return JSON.parse(localStorage.getItem("cache_"+getUser())||"{}");
}
function setCache(q,a){
  const c=getCache(); c[q]=a;
  localStorage.setItem("cache_"+getUser(),JSON.stringify(c));
}

// HISTORY
function getHistory(){
  return JSON.parse(localStorage.getItem("history_"+getUser())||"[]");
}
function addHistory(q,a){
  const h=getHistory(); h.unshift({q,a});
  localStorage.setItem("history_"+getUser(),JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  const h=getHistory();
  history.innerHTML = h.map(i=>`
    <div class="card mb-2">
      <b>${i.q}</b><br>${i.a}
    </div>
  `).join("");
}

// LIMIT
let usage=JSON.parse(localStorage.getItem("usage")||"{}");
function today(){return new Date().toISOString().split("T")[0];}

function canUse(){
  if(getUser()===ADMIN_EMAIL) return true;

  if(!usage[today()]) usage[today()]=0;
  if(usage[today()]>=5) return false;

  usage[today()]++;
  localStorage.setItem("usage",JSON.stringify(usage));
  return true;
}

// STATUS
function updateStatus(){
  if(getUser()===ADMIN_EMAIL){
    status.innerText="👑 Admin Unlimited";
  }else{
    status.innerText="Free uses left: "+(5-(usage[today()]||0));
  }
}

// ================= APP =================
const app={
async solveQuestion(){

  const q=questionInput.value.trim();
  if(!q) return alert("Enter question");

  if(!canUse()) return alert("Limit reached");

  // 🔒 DEMO ONLY FOR ADMIN
  if(getUser() === ADMIN_EMAIL){
    const demo = Object.values(EXAMPLES).find(e=>e.q.toLowerCase()===q.toLowerCase());
    if(demo){
      output.innerText="📘 Demo Answer:\n\n"+demo.a;
      return;
    }
  }

  const cache=getCache();
  if(cache[q]) return output.innerText=cache[q];

  output.innerText="⏳ Thinking...";

  try{
    const res=await fetch("/api/ask-ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await res.json();

    if(!data.answer){
      output.innerText="⚠️ AI unavailable";
      return;
    }

    output.innerText=data.answer;
    setCache(q,data.answer);
    addHistory(q,data.answer);

  }catch{
    output.innerText="⚠️ Server error";
  }

  updateStatus();
}
};

// INIT
controlDemoAccess();
renderDemo();
renderHistory();
updateStatus();

</script>

</body>
</html>
