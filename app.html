<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<script>
// 🔒 AUTH CHECK
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}
</script>

<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500">Logout</button>
</div>

<div class="p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"
placeholder="Type your question..."></textarea>

<button onclick="app.solveQuestion()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded">
Solve
</button>
</div>

<div id="output" class="p-4 text-lg"></div>

<!-- HISTORY -->
<div class="p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<script>

// LOGOUT
function logout() {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}

// ================= USER =================
function getCurrentUser() {
  return localStorage.getItem("currentUser");
}

// ================= CACHE (USER BASED) =================
function getCacheKey() {
  return "cache_" + getCurrentUser();
}

function getCache() {
  return JSON.parse(localStorage.getItem(getCacheKey()) || "{}");
}

function setCache(q, a) {
  const cache = getCache();
  cache[q] = a;

  if (Object.keys(cache).length > 50) {
    delete cache[Object.keys(cache)[0]];
  }

  localStorage.setItem(getCacheKey(), JSON.stringify(cache));
}

// ================= HISTORY (USER BASED) =================
function getHistoryKey() {
  return "history_" + getCurrentUser();
}

function getHistory() {
  return JSON.parse(localStorage.getItem(getHistoryKey()) || "[]");
}

function saveHistory(history) {
  localStorage.setItem(getHistoryKey(), JSON.stringify(history));
}

function renderHistory() {
  const history = getHistory();

  document.getElementById("history").innerHTML =
    history.map(item => `
      <div class="bg-white p-2 rounded shadow mb-2">
        <b>Q:</b> ${item.q}<br>
        <b>A:</b> ${item.a}
      </div>
    `).join("");
}

function addHistory(q, a) {
  const history = getHistory();
  history.unshift({ q, a });
  saveHistory(history);
  renderHistory();
}

// ================= LIMIT =================
let usage = JSON.parse(localStorage.getItem("usage") || "{}");

function getToday() {
  return new Date().toISOString().split("T")[0];
}

function canUse() {
  const today = getToday();
  if (!usage[today]) usage[today] = 0;

  if (usage[today] >= 3) return false;

  usage[today]++;
  localStorage.setItem("usage", JSON.stringify(usage));

  if (usage[today] === 2) {
    alert("⚠️ Only 1 question left today!");
  }

  return true;
}

// ================= ANTI SPAM =================
let lastRequest = 0;

function allowRequest() {
  const now = Date.now();
  if (now - lastRequest < 4000) return false;
  lastRequest = now;
  return true;
}

// ================= APP =================
const app = {

  showLoading() {
    document.getElementById("output").innerText = "⏳ Thinking...";
  },

  renderResult(text) {
    document.getElementById("output").innerText = text;
  },

  async solveQuestion() {

    const question = document.getElementById("questionInput").value.trim();

    if (!question) return alert("Enter a question");

    if (!allowRequest()) return alert("Wait a few seconds");

    if (!canUse()) return alert("❌ Daily limit reached");

    // CACHE
    const cache = getCache();
    if (cache[question]) {
      this.renderResult("⚡ Cached:\n\n" + cache[question]);
      return;
    }

    this.showLoading();

    try {
      const res = await fetch("/api/ask-ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ question })
      });

      const data = await res.json();
      console.log("API:", data);

      if (!res.ok) {
        this.renderResult("❌ " + (data.error || "Error"));
        return;
      }

      if (!data.answer) {
        this.renderResult("❌ No answer received");
        return;
      }

      this.renderResult(data.answer);

      setCache(question, data.answer);
      addHistory(question, data.answer);

    } catch (e) {
      console.error(e);
      this.renderResult("❌ Connection error");
    }
  }
};

// LOAD HISTORY
renderHistory();

</script>

</body>
</html>
