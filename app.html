<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<script>
// 🔒 AUTH CHECK
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}
</script>

<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500">Logout</button>
</div>

<div class="p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"
placeholder="Type your question..."></textarea>

<button onclick="app.solveQuestion()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded">
Solve
</button>
</div>

<div id="output" class="p-4 text-lg"></div>

<script>

// LOGOUT
function logout() {
  localStorage.removeItem("loggedIn");
  window.location.href = "index.html";
}

// ================= CACHE =================
function getCache() {
  return JSON.parse(localStorage.getItem("ai_cache") || "{}");
}

function setCache(q, a) {
  const cache = getCache();
  cache[q] = a;

  const keys = Object.keys(cache);
  if (keys.length > 50) delete cache[keys[0]];

  localStorage.setItem("ai_cache", JSON.stringify(cache));
}

// ================= LIMIT =================
let usage = JSON.parse(localStorage.getItem("usage") || "{}");

function getToday() {
  return new Date().toISOString().split("T")[0];
}

function canUse() {
  const today = getToday();
  if (!usage[today]) usage[today] = 0;

  if (usage[today] >= 3) return false;

  usage[today]++;
  localStorage.setItem("usage", JSON.stringify(usage));

  // ⚠️ warning
  if (usage[today] === 2) {
    alert("⚠️ Only 1 free question left today!");
  }

  return true;
}

// ================= ANTI SPAM =================
let lastRequest = 0;

function allowRequest() {
  const now = Date.now();
  if (now - lastRequest < 4000) return false;
  lastRequest = now;
  return true;
}

// ================= APP =================
const app = {

  showLoading() {
    document.getElementById("output").innerText = "⏳ Thinking...";
  },

  renderResult(text) {
    document.getElementById("output").innerText = text;
  },

  async solveQuestion() {

    const question = document.getElementById("questionInput").value.trim();

    if (!question) return alert("Enter a question");

    if (question.length > 200) {
      alert("Keep question short");
      return;
    }

    if (!allowRequest()) {
      alert("Wait a few seconds...");
      return;
    }

    if (!canUse()) {
      alert("❌ Daily limit reached");
      return;
    }

    // CACHE
    const cache = getCache();
    if (cache[question]) {
      this.renderResult("⚡ Cached:\n\n" + cache[question]);
      return;
    }

    this.showLoading();

    try {
      const res = await fetch("/api/ask-ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ question })
      });

      const data = await res.json();
      console.log("API:", data);

      if (!res.ok) {
        this.renderResult("❌ " + (data.error || "Error"));
        return;
      }

      if (!data.answer) {
        this.renderResult("❌ No answer");
        return;
      }

      this.renderResult(data.answer);
      setCache(question, data.answer);

    } catch (e) {
      console.error(e);
      this.renderResult("❌ Connection failed");
    }
  }
};

</script>

</body>
</html>
