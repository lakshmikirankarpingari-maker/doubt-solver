<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}
</script>

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold shadow">
🤖 DoubtSolve AI
</div>

<!-- STATUS -->
<div id="status" class="text-center text-sm mt-2 text-gray-600"></div>

<!-- LOGOUT -->
<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500 hover:underline">Logout</button>
</div>

<!-- INPUT -->
<div class="max-w-xl mx-auto p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28 shadow"
placeholder="Type your question..."></textarea>

<button onclick="app.solveQuestion()" 
class="mt-3 w-full bg-blue-600 text-white py-2 rounded shadow hover:bg-blue-700">
Solve
</button>
</div>

<!-- OUTPUT -->
<div id="output" class="max-w-xl mx-auto bg-white p-4 rounded shadow text-lg"></div>

<script>

// 👑 ADMIN
const ADMIN_EMAIL = "lakshmikirankarpingari@gmail.com";

function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

function getUser() {
  return localStorage.getItem("currentUser");
}

// CACHE
function getCache() {
  return JSON.parse(localStorage.getItem("cache_" + getUser()) || "{}");
}
function setCache(q,a){
  const c=getCache(); c[q]=a;
  localStorage.setItem("cache_"+getUser(),JSON.stringify(c));
}

// LIMIT
let usage = JSON.parse(localStorage.getItem("usage")||{});
function today(){ return new Date().toISOString().split("T")[0]; }

function canUse(){
  const user=getUser();

  if(user===ADMIN_EMAIL) return true;

  if(!usage[today()]) usage[today()]=0;

  if(usage[today()]>=5) return false;

  usage[today()]++;
  localStorage.setItem("usage",JSON.stringify(usage));
  return true;
}

// STATUS
function updateStatus(){
  const user=getUser();

  if(user===ADMIN_EMAIL){
    status.innerText="👑 Admin (Unlimited)";
  }else{
    status.innerText="Free uses left today: "+(5-(usage[today()]||0));
  }
}

// FALLBACK
function fallback(){
  return "⚠️ AI temporarily unavailable. Try later.";
}

// APP
const app={
async solveQuestion(){

  const q=questionInput.value.trim();
  if(!q) return alert("Enter question");

  if(!canUse()) return alert("Limit reached");

  const cache=getCache();
  if(cache[q]) return output.innerText=cache[q];

  output.innerText="⏳ Thinking...";

  try{
    const res=await fetch("/api/ask-ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await res.json();

    if(!res.ok || !data.answer){
      output.innerText=fallback();
      return;
    }

    output.innerText=data.answer;
    setCache(q,data.answer);

  }catch{
    output.innerText=fallback();
  }

  updateStatus();
}
};

updateStatus();

</script>

</body>
</html>
