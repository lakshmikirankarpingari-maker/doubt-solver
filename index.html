<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

</head>

<body class="bg-gray-100">

<script>
// SAFE LOGIN CHECK
const isLogged = localStorage.getItem("loggedIn");
if (!isLogged || isLogged !== "true") {
  window.location.replace("index.html");
}

// ERROR DEBUG
window.onerror = function(msg, url, line){
  alert("Error: " + msg + " at line " + line);
};
</script>

<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<div id="status" class="text-center text-sm mt-2"></div>

<div class="text-center mt-2">
<button onclick="logout()" class="text-red-500">Logout</button>
</div>

<!-- INPUT -->
<div class="p-4 max-w-xl mx-auto bg-white rounded shadow">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"></textarea>
<button onclick="app.solve()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded">Solve</button>
</div>

<!-- CAMERA -->
<div class="p-4 max-w-xl mx-auto bg-white mt-4 rounded shadow">
<h2 class="font-bold">📷 Camera</h2>
<video id="camera" class="w-full" autoplay></video>

<div class="flex gap-2 mt-2">
<button onclick="startCamera()" class="bg-green-500 text-white px-3 py-1 rounded">Start</button>
<button onclick="capture()" class="bg-blue-500 text-white px-3 py-1 rounded">Capture</button>
</div>

<canvas id="canvas" class="hidden"></canvas>
<img id="preview" class="mt-2"/>

<button onclick="solveImage()" class="mt-2 w-full bg-purple-600 text-white py-2 rounded">
Solve Image
</button>
</div>

<!-- OUTPUT -->
<div id="output" class="p-4 max-w-xl mx-auto bg-white mt-4 rounded"></div>

<!-- HISTORY -->
<div class="p-4 max-w-xl mx-auto">
<h2 class="font-bold">History</h2>
<div id="history"></div>
</div>

<script>

// ADMIN
const ADMIN = "lakshmikirankarpingari@gmail.com";

// USER
function getUser(){
  return (localStorage.getItem("currentUser") || ADMIN).toLowerCase();
}

// LOGOUT
function logout(){
  localStorage.clear();
  location.href="index.html";
}

// HISTORY
function getHistory(){
  return JSON.parse(localStorage.getItem("h_"+getUser())||"[]");
}
function addHistory(q,a){
  let h=getHistory();
  h.unshift({q,a});
  localStorage.setItem("h_"+getUser(),JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  history.innerHTML=getHistory().map(i=>`
    <div class="bg-white p-2 mb-2">${i.q}<br>${i.a}</div>
  `).join("");
}

// DEMO (WORKS FOR ALL)
const DEMO = {
"2+2":"4",
"force formula":"F = ma",
"water formula":"H2O",
"ai":"Artificial Intelligence"
};

// CAMERA SAFE
function startCamera(){
  if(!navigator.mediaDevices){
    alert("Camera not supported");
    return;
  }

  navigator.mediaDevices.getUserMedia({video:true})
  .then(s=>camera.srcObject=s)
  .catch(()=>alert("Camera blocked"));
}

function capture(){
  const ctx=canvas.getContext("2d");
  canvas.width=camera.videoWidth;
  canvas.height=camera.videoHeight;
  ctx.drawImage(camera,0,0);
  preview.src=canvas.toDataURL();
}

async function solveImage(){
  if(!preview.src) return alert("Capture first");

  output.innerText="Reading...";
  const r=await Tesseract.recognize(preview.src,"eng");
  questionInput.value=r.data.text.trim();
  app.solve();
}

// APP
const app={
async solve(){

  let q=questionInput.value.trim().toLowerCase();
  if(!q) return alert("Enter question");

  // DEMO FIRST
  if(DEMO[q]){
    output.innerText="📘 "+DEMO[q];
    return;
  }

  output.innerText="⏳ Thinking...";

  try{
    const res=await fetch("/api/ask-ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await res.json();

    if(!data.answer){
      output.innerText="AI unavailable";
      return;
    }

    output.innerText=data.answer;
    addHistory(q,data.answer);

  }catch{
    output.innerText="Server error";
  }
}
};

// INIT
renderHistory();

</script>

</body>
</html>
