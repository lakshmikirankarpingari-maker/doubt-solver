<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0f172a; color:white; font-family:Arial; }
.card { background:#1e293b; padding:20px; border-radius:12px; }
button { background:#38bdf8; padding:10px; border-radius:8px; margin-top:10px; }
</style>
</head>

<body class="flex items-center justify-center h-screen">

<div class="card w-full max-w-md text-center">
  <h1 class="text-2xl font-bold mb-4">DoubtSolve AI</h1>

  <textarea id="question" class="w-full p-2 text-black rounded"
    placeholder="Ask anything..."></textarea>

  <button onclick="solve()">Solve</button>

  <p id="answer" class="mt-4"></p>
</div>

<script>

// 🔥 SMART DEMO SYSTEM
const demoRules = [
  { keywords: ["2x","15"], answer: "2x + 5 = 15 → x = 5" },
  { keywords: ["sin","90"], answer: "sin(90°) = 1" },
  { keywords: ["cos","0"], answer: "cos(0°) = 1" },
  { keywords: ["speed"], answer: "Speed = Distance / Time" },
  { keywords: ["force"], answer: "Force = mass × acceleration (F = m × a)" },
  { keywords: ["newton"], answer: "Newton’s Second Law: F = m × a" },
  { keywords: ["ohm"], answer: "Ohm’s Law: V = IR" },
  { keywords: ["water","h2o"], answer: "H₂O is Water" },
  { keywords: ["oxygen"], answer: "Atomic number of Oxygen = 8" },
  { keywords: ["photosynthesis"], answer: "Plants make food using sunlight" },
  { keywords: ["heart"], answer: "Heart pumps blood" },
  { keywords: ["human brain"], answer: "Brain controls the body" },
  { keywords: ["acid"], answer: "Acids have pH < 7" },
  { keywords: ["base"], answer: "Bases have pH > 7" },
  { keywords: ["periodic"], answer: "Periodic table organizes elements" },
  { keywords: ["hello world"], answer: "console.log('Hello World');" },
  { keywords: ["python print"], answer: "print('Hello World')" },
  { keywords: ["html"], answer: "<h1>Hello World</h1>" },
  { keywords: ["gravity"], answer: "Gravity pulls objects toward Earth" },
  { keywords: ["energy"], answer: "Energy cannot be created or destroyed" },
  { keywords: ["cell"], answer: "Cell is the basic unit of life" },
  { keywords: ["dna"], answer: "DNA carries genetic information" }
];

function findDemoAnswer(q) {
  for (let rule of demoRules) {
    let match = rule.keywords.every(k => q.includes(k));
    if (match) return rule.answer;
  }
  return null;
}

async function solve() {
  let q = document.getElementById("question").value.toLowerCase();

  if (!q) {
    alert("Enter a question");
    return;
  }

  document.getElementById("answer").innerText = "Thinking...";

  // ✅ Smart demo match
  let demo = findDemoAnswer(q);
  if (demo) {
    document.getElementById("answer").innerText = demo;
    return;
  }

  // ✅ AI fallback
  try {
    const res = await fetch("/api/solve", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ question: q })
    });

    const data = await res.json();
    document.getElementById("answer").innerText =
      data.answer || "No response";

  } catch {
    document.getElementById("answer").innerText =
      "Demo limit reached. AI not available.";
  }
}
</script>

</body>
</html>
