<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">
<h2 class="text-xl font-bold text-center mb-4">Login</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2"/>
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2"/>

<button onclick="signup()" class="bg-gray-500 text-white w-full py-2 mb-2">Sign Up</button>
<button onclick="login()" class="bg-blue-600 text-white w-full py-2">Login</button>

<p id="msg" class="text-center text-sm mt-2 text-red-500"></p>
</div>

<script>

// ERROR DEBUG
window.onerror = function(msg, url, line){
  alert("Error: " + msg + " at line " + line);
};

// HASH
async function hash(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf))
    .map(b=>b.toString(16).padStart(2,"0")).join("");
}

// USERS
function getUsers(){
  return JSON.parse(localStorage.getItem("users") || "{}");
}

// SIGNUP
async function signup(){
  let email = emailInput().toLowerCase();
  let pass = passInput();

  if(!email || !pass){
    msg.innerText = "Enter details";
    return;
  }

  let users = getUsers();
  if(users[email]){
    msg.innerText = "User exists";
    return;
  }

  users[email] = { password: await hash(pass) };
  localStorage.setItem("users", JSON.stringify(users));

  msg.style.color = "green";
  msg.innerText = "Signup success";
}

// LOGIN
async function login(){
  let email = emailInput().toLowerCase();
  let pass = passInput();

  let users = getUsers();
  const hashed = await hash(pass);

  if(users[email] && users[email].password === hashed){
    localStorage.setItem("loggedIn","true");
    localStorage.setItem("currentUser", email);
    location.href="app.html";
  } else {
    msg.innerText = "Invalid login";
  }
}

function emailInput(){ return document.getElementById("email").value.trim(); }
function passInput(){ return document.getElementById("password").value.trim(); }

</script>

</body>
</html>
