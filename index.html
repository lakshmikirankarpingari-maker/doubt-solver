<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">
<h2 class="text-xl font-bold text-center mb-4">Login</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2"/>
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2"/>

<button onclick="signup()" class="bg-gray-500 text-white w-full py-2 mb-2">Sign Up</button>
<button onclick="login()" class="bg-blue-600 text-white w-full py-2">Login</button>

</div>

<script>
function signup() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  localStorage.setItem("user", JSON.stringify({email, pass}));
  alert("Signup successful");
}

function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  const user = JSON.parse(localStorage.getItem("user"));

  if (user && user.email === email && user.pass === pass) {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "app.html"; // ✅ IMPORTANT
  } else {
    alert("Invalid login");
  }
}
</script>

</body>
</html>
