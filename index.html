<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">
<h2 class="text-xl font-bold text-center mb-4">Login</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2"/>
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2"/>

<button onclick="signup()" class="bg-gray-500 text-white w-full py-2 mb-2">Sign Up</button>
<button onclick="login()" class="bg-blue-600 text-white w-full py-2">Login</button>

</div>

<script>

// GET USERS
function getUsers(){
  return JSON.parse(localStorage.getItem("users") || "{}");
}

// SIGNUP
function signup(){
  let email = document.getElementById("email").value.trim().toLowerCase();
  let pass = document.getElementById("password").value.trim();

  if(!email || !pass){
    alert("Enter email & password");
    return;
  }

  let users = getUsers();

  if(users[email]){
    alert("User already exists");
    return;
  }

  users[email] = { password: pass };
  localStorage.setItem("users", JSON.stringify(users));

  alert("Signup successful ✅");
}

// LOGIN
function login(){
  let email = document.getElementById("email").value.trim().toLowerCase();
  let pass = document.getElementById("password").value.trim();

  let users = getUsers();

  // DEBUG (optional)
  console.log("Stored users:", users);

  if(users[email] && users[email].password === pass){
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("currentUser", email);

    window.location.href = "app.html";
  } else {
    alert("❌ Invalid email or password");
  }
}

</script>

</body>
</html>
