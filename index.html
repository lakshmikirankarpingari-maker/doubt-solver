 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Google AdSense (PUT YOUR ID LATER) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
crossorigin="anonymous"></script>

</head>

<body class="bg-gray-100">

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<!-- SUBJECTS -->
<div class="flex gap-2 p-3 justify-center flex-wrap">
<button onclick="app.setSubject('Math')" class="bg-white px-3 py-1 rounded shadow">Math</button>
<button onclick="app.setSubject('Physics')" class="bg-white px-3 py-1 rounded shadow">Physics</button>
<button onclick="app.setSubject('Chemistry')" class="bg-white px-3 py-1 rounded shadow">Chemistry</button>
<button onclick="app.setSubject('Biology')" class="bg-white px-3 py-1 rounded shadow">Biology</button>
</div>

<!-- INPUT -->
<div class="p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"
placeholder="Type your question..."></textarea>

<button onclick="startVoice()" class="mt-2 bg-green-500 text-white px-3 py-1 rounded">
🎤 Speak
</button>

<button onclick="app.solveQuestion()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded">
Solve
</button>
</div>

<!-- OUTPUT -->
<div id="output" class="p-4"></div>

<!-- AD SPACE -->
<div class="p-4">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-XXXXXXXX"
data-ad-slot="1234567890"
data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<!-- HISTORY -->
<div class="p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<script>

function startVoice() {
  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    document.getElementById("questionInput").value =
      e.results[0][0].transcript;
  };
  recognition.start();
}

const app = {

  subject: "General",

  setSubject: function(sub) {
    this.subject = sub;
    alert("Subject: " + sub);
  },

  showLoading: function() {
    document.getElementById("output").innerHTML = "Thinking...";
  },

  renderResult: function(text) {
    const el = document.getElementById("output");
    el.innerHTML = "";
    let i = 0;
    const interval = setInterval(() => {
      el.innerHTML += text[i];
      i++;
      if (i >= text.length) clearInterval(interval);
    }, 10);
  },

  addHistory: function(q, a) {
    const old = JSON.parse(localStorage.getItem("history") || "[]");
    const updated = [{q,a}, ...old];
    localStorage.setItem("history", JSON.stringify(updated));

    document.getElementById("history").innerHTML =
      updated.map(item => `
        <div class="bg-white p-2 rounded shadow mb-2">
          <b>Q:</b> ${item.q}<br>
          <b>A:</b> ${item.a}
        </div>
      `).join("");
  },

  solveQuestion: async function() {

    const input = document.getElementById("questionInput");
    const question = input.value.trim();

    if (!question) {
      alert("Enter a question");
      return;
    }

    this.showLoading();

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          question: `[${this.subject}] ${question}`
        })
      });

      const data = await res.json();
      const answer = data.answer || "No response";

      this.renderResult(answer);
      this.addHistory(question, answer);

    } catch(e) {
      this.renderResult("❌ Error connecting to AI");
    }
  }
};

</script>

</body>
</html>
