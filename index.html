<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-80 text-center">
<h2 class="text-2xl font-bold mb-4 text-blue-600">🤖 DoubtSolve AI</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-3 rounded"/>
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-3 rounded"/>

<button onclick="signup()" class="bg-gray-500 text-white w-full py-2 rounded mb-2 hover:bg-gray-600">
Sign Up
</button>

<button onclick="login()" class="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700">
Login
</button>

<p id="msg" class="mt-3 text-sm text-red-500"></p>
</div>

<script>
function getUsers() {
  return JSON.parse(localStorage.getItem("users") || "[]");
}

function saveUsers(users) {
  localStorage.setItem("users", JSON.stringify(users));
}

function signup() {
  const email = email.value.trim();
  const pass = password.value.trim();

  if (!email || !pass) return showMsg("Enter details");

  let users = getUsers();

  if (users.find(u => u.email === email)) {
    return showMsg("User exists");
  }

  users.push({ email, pass });
  saveUsers(users);

  showMsg("Signup success ✅", "green");
}

function login() {
  const emailVal = email.value.trim();
  const passVal = password.value.trim();

  const user = getUsers().find(u => u.email === emailVal && u.pass === passVal);

  if (user) {
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("currentUser", emailVal);
    window.location.href = "app.html";
  } else {
    showMsg("Invalid login ❌");
  }
}

function showMsg(t, c="red"){
  msg.innerText = t;
  msg.style.color = c;
}
</script>

</body>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">
<h2 class="text-xl font-bold text-center mb-4">🔐 Login</h2>

<input id="email" placeholder="Email" class="border p-2 w-full mb-2"/>
<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2"/>

<button onclick="signup()" class="bg-gray-500 text-white w-full py-2 mb-2">Sign Up</button>
<button onclick="login()" class="bg-blue-600 text-white w-full py-2">Login</button>

<p id="msg" class="text-center mt-2 text-red-500"></p>
</div>

<script>

// AUTO LOGIN
if (localStorage.getItem("loggedIn") === "true") {
  window.location.href = "app.html";
}

// USERS
function getUsers() {
  return JSON.parse(localStorage.getItem("users") || "[]");
}

function saveUsers(users) {
  localStorage.setItem("users", JSON.stringify(users));
}

// SIGNUP
function signup() {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (!email || !pass) return showMsg("Enter email & password");

  let users = getUsers();

  if (users.find(u => u.email === email)) {
    return showMsg("User already exists");
  }

  users.push({ email, pass });
  saveUsers(users);

  showMsg("Signup successful ✅", "green");
}

// LOGIN
function login() {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();

  const users = getUsers();
  const user = users.find(u => u.email === email && u.pass === pass);

  if (user) {
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("currentUser", email);
    window.location.href = "app.html";
  } else {
    showMsg("Invalid login ❌");
  }
}

function showMsg(text, color="red") {
  const el = document.getElementById("msg");
  el.innerText = text;
  el.style.color = color;
}

</script>

</body>
</html>
